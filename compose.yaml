services:
  mongodb:
    image: mongo:latest
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: errandboard
      MONGO_USER_SERVICE_PASSWORD: ${MONGO_USER_SERVICE_PASSWORD}
      MONGO_SUPPLIER_SERVICE_PASSWORD: ${MONGO_SUPPLIER_SERVICE_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./config/db.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - errandboard-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      MONGO_HOST: mongodb
      MONGO_DB_NAME: errandboard
      MONGO_USER_SERVICE_PASSWORD: ${MONGO_USER_SERVICE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - errandboard-network

volumes:
  mongodb_data:

networks:
  errandboard-network:
    driver: bridge