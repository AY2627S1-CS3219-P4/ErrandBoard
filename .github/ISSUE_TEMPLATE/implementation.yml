name: Implementation Task
description: Track implementation of a functional requirement
title: "[FR] "
body:
  - type: input
    id: fr
    attributes:
      label: Functional Requirement
      description: Enter one or more FR IDs, e.g. F1.4 or F28.2.11. Keep the IDs in this issue body; the tracker is updated when this issue is closed.
      placeholder: F1.4
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Describe what needs to be implemented
    validations:
      required: true
