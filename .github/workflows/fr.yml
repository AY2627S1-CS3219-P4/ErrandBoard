name: Update FR Tracker

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: write

# This workflow expects the implementation issue to be closed after the
# corresponding PR has been merged. The issue body must contain one or more
# tracker IDs such as F1.4 or F28.2.11.

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update FR tracker
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # Extract distinct IDs from the issue body. The pattern supports
          # both top-level and nested requirements (for example F1.4.2).
          mapfile -t fr_ids < <(
            printf '%s\n' "$ISSUE_BODY" |
              grep -oE '\bF[0-9]+(\.[0-9]+)*\b' |
              sort -u || true
          )

          if [ "${#fr_ids[@]}" -eq 0 ]; then
            echo "No FR IDs found in the closed issue; nothing to update."
            exit 0
          fi

          for fr_id in "${fr_ids[@]}"; do
            # Update only the matching table row. Exact ID matching prevents
            # F1 from matching F1.1, etc.
            FR_ID="$fr_id" perl -pi -e '
              if (/\| [^|]*\Q$ENV{FR_ID}\E \|/) {
                if ($ENV{ISSUE_ACTION} eq "reopened") {
                  # Do not clear another issue link if multiple issues
                  # happen to reference the same FR.
                  if (/Issue: \[Issue #\Q$ENV{ISSUE_NUMBER}\E\]/) {
                    s/\[x\](?= \Q$ENV{FR_ID}\E)/[ ]/;
                    s/Issue: \[Issue #[^]]+\]\([^)]*\)/Issue: -/;
                  }
                } else {
                  s/\[ \](?= \Q$ENV{FR_ID}\E)/[x]/;
                  s/Issue: -/Issue: [Issue #$ENV{ISSUE_NUMBER}]($ENV{ISSUE_URL})/;
                }
              }
            ' FR-TRACKER.md
          done

          if git diff --quiet -- FR-TRACKER.md; then
            echo "No unchecked matching FR items found; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FR-TRACKER.md
          git commit -m "chore: update FR status for issue #${{ github.event.issue.number }} (${{ github.event.action }})"
          git push
